
name: Test Contributions GraphQL

on:
  workflow_dispatch:
  push:
    branches:
      - feature/contribution-matrix
    paths:
      - 'scripts/update-contributions.py'
      - '.github/workflows/test-contributions-graphql.yml'

permissions:
  contents: read

jobs:
  test-graphql:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout contribution matrix branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and Compare GitHub Contributions
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.SORIN_CONTRIBUTIONS_TOKEN }}
          EXPECTED_LOGIN: sorinoi
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("CONTRIBUTIONS_TOKEN", "")
          expected = os.environ["EXPECTED_LOGIN"]

          if not token:
              sys.exit("FAIL: Contributions token missing")

          def graphql(query):
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "SORIN.exe-Diagnostics",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as exc:
                  sys.exit(
                      f"FAIL: GitHub API HTTP {exc.code}"
                  )

              if result.get("errors"):
                  print(json.dumps(result["errors"], indent=2))
                  sys.exit("FAIL: GraphQL errors")

              return result["data"]

          # 1. Compare default viewer and user
          default_query = """
          query {
            viewer {
              login
              contributionsCollection {
                startedAt
                endedAt
                restrictedContributionsCount
                hasAnyRestrictedContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                      weekday
                    }
                  }
                }
              }
            }
            user(login: "sorinoi") {
              login
              isViewer
              contributionsCollection {
                startedAt
                endedAt
                restrictedContributionsCount
                hasAnyRestrictedContributions
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          data = graphql(default_query)

          viewer = data["viewer"]
          user = data["user"]

          if viewer["login"].lower() != expected.lower():
              sys.exit("FAIL: Token account mismatch")

          for key, account in (
              ("VIEWER", viewer),
              ("USER", user),
          ):
              collection = account["contributionsCollection"]

              print(f"--- {key} DEFAULT ---")
              print("Login:", account["login"])
              print("Started:", collection["startedAt"])
              print("Ended:", collection["endedAt"])
              print(
                  "Total:",
                  collection["contributionCalendar"]["totalContributions"]
              )
              print(
                  "Restricted:",
                  collection["restrictedContributionsCount"]
              )
              print(
                  "Has Restricted:",
                  collection["hasAnyRestrictedContributions"]
              )

          print("USER isViewer:", user["isViewer"])

          days = [
              day
              for week in viewer["contributionsCollection"][
                  "contributionCalendar"
              ]["weeks"]
              for day in week["contributionDays"]
          ]

          assert 365 <= len(days) <= 371, (
              f"Unexpected calendar days: {len(days)}"
          )

          print("Calendar days:", len(days))
          print("PASS: Default GraphQL validation")

          # 2. Query calendar year 2026
          year_query = """
          query {
            viewer {
              contributionsCollection(
                from: "2026-01-01T00:00:00Z"
                to: "2026-11-03T23:59:59Z"
              ) {
                startedAt
                endedAt
                restrictedContributionsCount
                hasAnyRestrictedContributions
                contributionCalendar {
                  totalContributions
                }
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalRepositoryContributions
              }
            }
          }
          """

          year_data = graphql(year_query)
          collection = year_data["viewer"][
              "contributionsCollection"
          ]

          print("--- CALENDAR YEAR 2026 ---")
          print("Started:", collection["startedAt"])
          print("Ended:", collection["endedAt"])
          print(
              "Calendar Total:",
              collection["contributionCalendar"]["totalContributions"]
          )
          print(
              "Restricted:",
              collection["restrictedContributionsCount"]
          )
          print(
              "Has Restricted:",
              collection["hasAnyRestrictedContributions"]
          )
          print(
              "Commits:",
              collection["totalCommitContributions"]
          )
          print(
              "Issues:",
              collection["totalIssueContributions"]
          )
          print(
              "Pull Requests:",
              collection["totalPullRequestContributions"]
          )
          print(
              "Reviews:",
              collection["totalPullRequestReviewContributions"]
          )
          print(
              "Repositories:",
              collection["totalRepositoryContributions"]
          )

          default_total = viewer[
              "contributionsCollection"
          ]["contributionCalendar"]["totalContributions"]

          year_total = collection[
              "contributionCalendar"
          ]["totalContributions"]

          print("--- COMPARISON ---")
          print("Default Total:", default_total)
          print("Year 2026 Total:", year_total)
          print("Difference:", year_total - default_total)
          print("GitHub Profile Reported:", 875)
          print("Profile Difference:", 875 - year_total)
          print("PASS: Diagnostics completed")
          PY

      - name: Generate Contribution Matrix SVG
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.SORIN_CONTRIBUTIONS_TOKEN }}
          PROFILE_USERNAME: sorinoi
        run: python scripts/update-contributions.py

      - name: Apply Seamless Styling
        run: python scripts/polish-svg.py contribution-matrix.svg

      - name: Validate Contribution Matrix SVG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("assets/contribution-matrix.svg")
          assert path.is_file(), "SVG not generated"

          root = ET.parse(path).getroot()
          ns = "{http://www.w3.org/2000/svg}"

          assert root.tag == f"{ns}svg"
          assert root.get("viewBox") == "0 0 1475 365"
          assert root.get("width") == "1475"
          assert root.get("height") == "365"

          rects = root.findall(f".//{ns}rect")
          heatmap = [
              r for r in rects
              if r.get("width") == "15"
              and r.get("height") == "15"
              and float(r.get("y", 0)) < 290
          ]

          assert 365 <= len(heatmap) <= 371, (
              f"Unexpected heatmap cells: {len(heatmap)}"
          )

          texts = [
              "".join(t.itertext())
              for t in root.findall(f".//{ns}text")
          ]

          assert any(
              "CONTRIBUTION MATRIX" in t for t in texts
          ), "Missing title"

          assert any(
              "CONTRIBUTIONS" in t for t in texts
          ), "Missing contribution summary"

          print("PASS: SVG XML structure")
          print("PASS: SVG dimensions 1475 x 365")
          print("PASS: Heatmap cells:", len(heatmap))
          print("PASS: Contribution summary")
          PY

      - name: Upload Contribution Matrix Preview
        uses: actions/upload-artifact@v4
        with:
          name: sorin-contribution-matrix-preview
          path: assets/contribution-matrix.svg
          if-no-files-found: error
          retention-days: 7
