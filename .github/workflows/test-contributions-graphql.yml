
name: Test Contributions GraphQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-graphql:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GitHub Contribution Calendar
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.SORIN_CONTRIBUTIONS_TOKEN }}
          EXPECTED_LOGIN: sorinoi
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("CONTRIBUTIONS_TOKEN", "")
          expected = os.environ["EXPECTED_LOGIN"]

          if not token:
              sys.exit("FAIL: Contributions secret is missing")

          query = """
          query {
            viewer {
              login
              contributionsCollection {
                startedAt
                endedAt
                hasAnyRestrictedContributions
                restrictedContributionsCount
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({"query": query}).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "SORIN.exe-Contributions-Test",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              sys.exit(
                  f"FAIL: GitHub API returned HTTP {exc.code}"
              )
          except Exception:
              sys.exit("FAIL: GraphQL request failed")

          if result.get("errors"):
              sys.exit(
                  "FAIL: GraphQL returned errors; "
                  "check token permissions and query"
              )

          viewer = (result.get("data") or {}).get("viewer")
          if not viewer:
              sys.exit("FAIL: Viewer data missing")

          if viewer["login"].lower() != expected.lower():
              sys.exit("FAIL: Token belongs to wrong account")

          collection = viewer["contributionsCollection"]
          calendar = collection["contributionCalendar"]

          days = [
              day
              for week in calendar["weeks"]
              for day in week["contributionDays"]
          ]

          if not 365 <= len(days) <= 371:
              sys.exit("FAIL: Unexpected calendar size")

          valid_levels = {
              "NONE",
              "FIRST_QUARTILE",
              "SECOND_QUARTILE",
              "THIRD_QUARTILE",
              "FOURTH_QUARTILE",
          }

          if any(
              day["contributionLevel"] not in valid_levels
              for day in days
          ):
              sys.exit("FAIL: Invalid contribution level")

          print("PASS: Authenticated GitHub GraphQL")
          print("PASS: Token account matches expected login")
          print("PASS: Contribution calendar structure")
          print("Calendar days:", len(days))
          print("Total contributions:",
                calendar["totalContributions"])
          print("Restricted contributions:",
                collection["restrictedContributionsCount"])
          print("Has restricted contributions:",
                collection["hasAnyRestrictedContributions"])
          print("PASS: No repository details requested")
          PY
