
name: Test Contributions GraphQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-graphql:
    runs-on: ubuntu-latest

    steps:
      - name: Verify GitHub Contribution Calendar
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.SORIN_CONTRIBUTIONS_TOKEN }}
          EXPECTED_LOGIN: sorinoi
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("CONTRIBUTIONS_TOKEN", "")
          expected = os.environ["EXPECTED_LOGIN"]

          if not token:
              sys.exit("FAIL: Contributions secret is missing")

          query = """
          query {
            viewer {
              login
              contributionsCollection {
                startedAt
                endedAt
                hasAnyRestrictedContributions
                restrictedContributionsCount
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({"query": query}).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "SORIN.exe-Contributions-Test",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              sys.exit(
                  f"FAIL: GitHub API returned HTTP {exc.code}"
              )
          except Exception:
              sys.exit("FAIL: GraphQL request failed")

          if result.get("errors"):
              sys.exit(
                  "FAIL: GraphQL returned errors; "
                  "check token permissions and query"
              )

          viewer = (result.get("data") or {}).get("viewer")
          if not viewer:
              sys.exit("FAIL: Viewer data missing")

          if viewer["login"].lower() != expected.lower():
              sys.exit("FAIL: Token belongs to wrong account")

          collection = viewer["contributionsCollection"]
          calendar = collection["contributionCalendar"]

          days = [
              day
              for week in calendar["weeks"]
              for day in week["contributionDays"]
          ]

          if not 365 <= len(days) <= 371:
              sys.exit("FAIL: Unexpected calendar size")

          valid_levels = {
              "NONE",
              "FIRST_QUARTILE",
              "SECOND_QUARTILE",
              "THIRD_QUARTILE",
              "FOURTH_QUARTILE",
          }

          if any(
              day["contributionLevel"] not in valid_levels
              for day in days
          ):
              sys.exit("FAIL: Invalid contribution level")

          print("PASS: Authenticated GitHub GraphQL")
          print("PASS: Token account matches expected login")
          print("PASS: Contribution calendar structure")
          print("Calendar days:", len(days))
          print("Total contributions:",
                calendar["totalContributions"])
          print("Restricted contributions:",
                collection["restrictedContributionsCount"])
          print("Has restricted contributions:",
                collection["hasAnyRestrictedContributions"])
          print("PASS: No repository details requested")
          PY

          
      - name: Checkout contribution matrix branch
        uses: actions/checkout@v4
        with:
          ref: feature/contribution-matrix
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Contribution Matrix SVG
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.SORIN_CONTRIBUTIONS_TOKEN }}
          PROFILE_USERNAME: sorinoi
        run: python scripts/update-contributions.py

      - name: Validate Contribution Matrix SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("assets/contribution-matrix.svg")
          assert path.exists(), "SVG not generated"

          root = ET.parse(path).getroot()
          ns = "{http://www.w3.org/2000/svg}"

          assert root.get("viewBox") == "0 0 1475 365"

          rects = root.findall(f".//{ns}rect")
          heatmap = [
              r for r in rects
              if r.get("width") == "15"
              and r.get("height") == "15"
              and float(r.get("y", 0)) < 290
          ]

          assert 365 <= len(heatmap) <= 371, (
              f"Unexpected heatmap cells: {len(heatmap)}"
          )

          texts = [
              "".join(t.itertext())
              for t in root.findall(f".//{ns}text")
          ]

          assert any(
              "CONTRIBUTION MATRIX" in t for t in texts
          ), "Missing title"

          assert any(
              "CONTRIBUTIONS" in t for t in texts
          ), "Missing contribution total"

          print("PASS: SVG XML structure")
          print("PASS: SVG dimensions 1475 x 365")
          print("PASS: Heatmap cells:", len(heatmap))
          print("PASS: Contribution summary")
          PY

      - name: Upload Contribution Matrix Preview
        uses: actions/upload-artifact@v4
        with:
          name: sorin-contribution-matrix-preview
          path: assets/contribution-matrix.svg
          if-no-files-found: error
          retention-days: 7
