name: Update Pixel Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update public GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: sorinoi
        run: python scripts/update-stats.py

      - name: Commit changed SVG
        run: |
          if git diff --quiet -- assets/tech-dashboard.svg; then
            echo 'No stats changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tech-dashboard.svg
          git commit -m 'chore: refresh profile stats'
          git push
